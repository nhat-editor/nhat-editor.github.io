<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SaaS launch concept frame</title>
  <desc id="desc">Floating product interface panels with green motion accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1"><stop stop-color="#030604"/><stop offset="1" stop-color="#10271f"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#18382c"/><stop offset="1" stop-color="#07100c"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="35" stdDeviation="30" flood-color="#000" flood-opacity=".7"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="270" cy="130" r="290" fill="#22c79a" opacity=".1"/>
  <g transform="translate(116 125)">
    <text fill="#8fe3b0" font-family="Arial,sans-serif" font-size="24" letter-spacing="8">CONCEPT 02 · SAAS LAUNCH</text>
    <text y="108" fill="#e2f0ea" font-family="Georgia,serif" font-size="96">A product story</text>
    <text y="207" fill="#22c79a" font-family="Georgia,serif" font-size="96" font-style="italic">built to move.</text>
  </g>
  <g transform="translate(775 150) rotate(4)" filter="url(#shadow)">
    <rect width="670" height="515" rx="34" fill="url(#card)" stroke="#8fe3b0" stroke-opacity=".35"/>
    <circle cx="52" cy="48" r="8" fill="#22c79a"/><circle cx="82" cy="48" r="8" fill="#8fe3b0" opacity=".5"/>
    <rect x="46" y="92" width="578" height="128" rx="20" fill="#22c79a" opacity=".12"/>
    <rect x="46" y="252" width="276" height="210" rx="20" fill="#e2f0ea" opacity=".06"/>
    <rect x="348" y="252" width="276" height="210" rx="20" fill="#22c79a" opacity=".08"/>
    <path d="M82 400l62-58 55 28 72-82" fill="none" stroke="#22c79a" stroke-width="8"/>
  </g>
  <g transform="translate(130 620)"><rect width="500" height="110" rx="55" fill="#22c79a"/><text x="250" y="70" text-anchor="middle" fill="#020503" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="4">CLARITY → ACTION</text></g>
</svg>
